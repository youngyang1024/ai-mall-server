spring:
  ai:
    openai:
      base-url: https://relay.example.com
      api-key: replace-me
      embedding:
        base-url: https://api.siliconflow.cn
        api-key: replace-me
  datasource:
    url: jdbc:mysql://mysql.infra.dev.ug:3306/ai_mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
