spring:
  jmx:
    enabled: false
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB
  application:
    name: ai-mall-toB-server
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8081

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

pagehelper:
  helper-dialect: mysql
  reasonable: true

jwt:
  secret: ai-mall-jwt-secret-key-2026
  expiration: 604800000

# agent-server 内部只读接口的服务间调用令牌（/admin/internal/**，独立于 admin 登录态）
aimall:
  internal-token: ${INTERNAL_TOKEN:replace-me}

aws:
  s3:
    accessKeyId: ${AWS_ACCESS_KEY_ID:}
    accessKeySecret: ${AWS_SECRET_ACCESS_KEY:}
    regionName: ${AWS_REGION:us-east-1}
    defaultBucket: ${AWS_S3_BUCKET:media-local-s3}
    prefix: ${AWS_S3_PREFIX:growth/dev}
